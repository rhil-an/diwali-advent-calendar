<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="An interactive Diwali countdown calendar — light a diya each day to reveal a festival tradition." />
  <meta name="theme-color" content="#0D0D2B" />
  <meta name="color-scheme" content="dark" />
  <title>Diwali Advent Calendar</title>

  <!-- Preload critical above-the-fold artwork so the main scene paints
       instantly instead of popping in piece by piece. Paths are relative
       so this also works when index.html is opened directly (file://). -->
  <link rel="preload" as="image" href="images/diwali-background.png" />
  <link rel="preload" as="image" href="assets/mandala/mandala-outer.png" />
  <link rel="preload" as="image" href="assets/mandala/mandala-middle.png" />
  <link rel="preload" as="image" href="assets/mandala/mandala-center.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@300;400&display=swap"
    rel="stylesheet"
  />

  <!-- p5.js -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="canvas-container">
    <!-- CSS two-circle moon — shadow slides via translateX as days unlock -->
    <div id="moon-container" class="moon-container" aria-hidden="true">
      <div class="moon-light"></div>
      <div id="moon-shadow" class="moon-shadow"></div>
    </div>
  </div>

  <!-- Calendar config, embedded as a JS global (window.DIWALI_DAYS_DATA)
       instead of a .json file loaded via fetch(). Browsers block fetch()/XHR
       to local files under file://, which is why this must load as a plain
       script instead of being read with p5's loadJSON(). Regenerate this
       file from assets/diwali_days.json via tools/sync_diwali_days_js.py. -->
  <script src="assets/diwali-days-data.js"></script>

  <!-- Diya and ScrollBanner classes must load before sketch -->
  <script src="diya.js"></script>
  <script src="scroll.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
